plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'ru.lavista'
version = '1.0.0'

base { archivesName = 'dictatorship' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.172'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        dictatorship { sourceSet sourceSets.main }
    }
}
